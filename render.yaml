# Blueprint do Render: cria o Postgres grátis e a API (Docker) de uma vez.
# No Render: New → Blueprint → escolha este repositório → Apply.
# Os dois na mesma região, para a API falar com o banco pela rede interna.

databases:
  - name: antidoto-banco
    plan: free
    region: virginia
    databaseName: antidoto
    user: antidoto

services:
  - type: web
    name: antidoto-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      # postgresql://usuario:senha@host/banco; a API converte para JDBC (BancoDoRender)
      - key: DATABASE_URL
        fromDatabase:
          name: antidoto-banco
          property: connectionString
      # Segredo do JWT: o Render gera um valor base64 de 256 bits na criação
      - key: JWT_SECRET
        generateValue: true
      # O app no celular não usa CORS; isto é só para o Expo Web no computador
      - key: CORS_ORIGENS
        value: http://localhost:8081
      # Usuários de teste, 12 unidades fictícias e os exemplos do cidadão
      - key: CARREGAR_DADOS_INICIAIS
        value: "true"
      # IA do resumo (Groq). A chave não vai para o Git: o Render pede o valor ao criar o
      # Blueprint. Sem chave (ou se o Groq falhar), vale o resumo do modelo padrão.
      - key: GROQ_API_KEY
        sync: false
      - key: IA_HABILITADA
        value: "true"
      - key: IA_MODELO
        value: openai/gpt-oss-120b
