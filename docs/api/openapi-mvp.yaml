openapi: 3.0.3
info:
  title: SOS Peçonha — API Java (MVP)
  version: 1.0.0
  description: |
    Contrato ÚNICO entre o app mobile e o backend Java (MVP).
    Regras citadas (RN-U, RN-S, RN-G) estão em MVP-00-LEIA-ME.md.
    Mudou algo aqui? Combine com o front ANTES de implementar.
    Datas e horas em ISO-8601 UTC (ex.: 2026-11-10T22:15:00Z). Enums em MAIÚSCULAS.
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://{host}
    description: Nuvem (Azure)
    variables:
      host:
        default: sospeconha-api.azurewebsites.net

tags:
  - name: Auth
  - name: Usuarios
  - name: Unidades
  - name: Ocorrencias
  - name: Avistamentos
  - name: Conteudo

security:
  - bearerAuth: []

paths:
  /api/auth/cadastro:
    post:
      tags: [Auth]
      summary: Cadastro de cidadão (já devolve o token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroRequest' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Erro400' }
        '409': { $ref: '#/components/responses/Erro409' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }

  /api/usuarios/me:
    get:
      tags: [Usuarios]
      summary: Dados do usuário logado
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Erro401' }
    put:
      tags: [Usuarios]
      summary: Atualiza nome e telefone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarUsuarioRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }

  /api/unidades:
    get:
      tags: [Unidades]
      summary: Lista paginada de unidades ativas (público)
      security: []
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaUnidade' }
    post:
      tags: [Unidades]
      summary: Cria unidade (GESTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnidadeRequest' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unidade' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }

  /api/unidades/proximas:
    get:
      tags: [Unidades]
      summary: Unidades mais próximas com soro compatível (público) — RN-S1…RN-S4
      security: []
      parameters:
        - in: query
          name: latitude
          required: true
          schema: { type: number, format: double, minimum: -34, maximum: 6 }
        - in: query
          name: longitude
          required: true
          schema: { type: number, format: double, minimum: -74, maximum: -34 }
        - in: query
          name: tipoAnimal
          required: true
          schema: { $ref: '#/components/schemas/TipoAnimal' }
        - in: query
          name: limite
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        '200':
          description: OK (pode ser lista vazia)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnidadeProxima' }
        '400': { $ref: '#/components/responses/Erro400' }

  /api/unidades/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Unidades]
      summary: Detalhe da unidade (público)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unidade' }
        '404': { $ref: '#/components/responses/Erro404' }
    put:
      tags: [Unidades]
      summary: Atualiza a unidade, inclusive os soros disponíveis (GESTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnidadeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unidade' }
        '400': { $ref: '#/components/responses/Erro400' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
    delete:
      tags: [Unidades]
      summary: Desativa a unidade (exclusão lógica, ativa=false) (GESTOR)
      responses:
        '204': { description: Desativada }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }

  /api/ocorrencias:
    post:
      tags: [Ocorrencias]
      summary: Registra a ocorrência (logado). Calcula a urgência (RN-U) e dispara o resumo por IA (assíncrono)
      description: |
        Responde 201 na hora com statusResumo=PENDENTE. O resumo é gerado em segundo plano
        (RabbitMQ + Spring AI). O app consulta GET /api/ocorrencias/{id} a cada 3 s até
        statusResumo ser PRONTO ou MODELO_PADRAO.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OcorrenciaRequest' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ocorrencia' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }

  /api/ocorrencias/minhas:
    get:
      tags: [Ocorrencias]
      summary: Histórico de ocorrências do usuário (mais recentes primeiro)
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaOcorrencia' }
        '401': { $ref: '#/components/responses/Erro401' }

  /api/ocorrencias/unidade/{unidadeId}:
    get:
      tags: [Ocorrencias]
      summary: Ocorrências destinadas a uma unidade (GESTOR) — demonstração via Swagger
      parameters:
        - in: path
          name: unidadeId
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaOcorrencia' }
        '403': { $ref: '#/components/responses/Erro403' }

  /api/ocorrencias/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Ocorrencias]
      summary: Detalhe (somente o dono; outro usuário → 404)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ocorrencia' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }
    put:
      tags: [Ocorrencias]
      summary: Atualiza a triagem (ex. sintomas novos ou outra unidade) — somente o dono
      description: >
        Mesmas regras do registro (RN-G4 e unidade ativa). Recalcula a urgência (RN-U) com a hora
        da atualização, volta o resumo para PENDENTE e gera um novo em segundo plano. Com o resumo
        anterior ainda PENDENTE, responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OcorrenciaRequest' }
      responses:
        '200':
          description: OK (statusResumo PENDENTE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ocorrencia' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
    delete:
      tags: [Ocorrencias]
      summary: Remove do histórico (somente o dono)
      responses:
        '204': { description: Removida }
        '404': { $ref: '#/components/responses/Erro404' }

  /api/avistamentos:
    post:
      tags: [Avistamentos]
      summary: Registra avistamento (logado)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvistamentoRequest' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avistamento' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }

  /api/avistamentos/meus:
    get:
      tags: [Avistamentos]
      summary: Meus avistamentos (mais recentes primeiro)
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAvistamento' }
        '401': { $ref: '#/components/responses/Erro401' }

  /api/avistamentos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Avistamentos]
      summary: Detalhe (somente o dono — RN-G5)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avistamento' }
        '404': { $ref: '#/components/responses/Erro404' }
    put:
      tags: [Avistamentos]
      summary: Edita (somente o dono)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvistamentoRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avistamento' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
    delete:
      tags: [Avistamentos]
      summary: Exclui (somente o dono)
      responses:
        '204': { description: Excluído }
        '404': { $ref: '#/components/responses/Erro404' }

  /api/conteudo/primeiros-socorros/{tipoAnimal}:
    get:
      tags: [Conteudo]
      summary: Primeiros socorros do animal (público) — MVP-02 §6
      security: []
      parameters:
        - in: path
          name: tipoAnimal
          required: true
          schema: { $ref: '#/components/schemas/TipoAnimal' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrimeirosSocorros' }
        '400': { $ref: '#/components/responses/Erro400' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Pagina:
      in: query
      name: pagina
      schema: { type: integer, minimum: 0, default: 0 }
    Tamanho:
      in: query
      name: tamanho
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    Erro400:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Erro401:
      description: Não autenticado, token inválido/expirado ou credenciais erradas
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Erro403:
      description: Perfil sem permissão
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Erro404:
      description: Não encontrado (ou não pertence ao usuário)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    Erro409:
      description: 'Conflito (ex.: e-mail já cadastrado; resumo da ocorrência ainda sendo gerado)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }

  schemas:
    TipoAnimal:
      type: string
      enum: [ESCORPIAO, SERPENTE, ARANHA, LAGARTA, ABELHA, NAO_SEI]
    FaixaEtaria:
      type: string
      enum: [CRIANCA, ADULTO, IDOSO]
    Urgencia:
      type: string
      enum: [EMERGENCIA, ALTA, MODERADA]
    TipoSoro:
      type: string
      enum: [ANTIESCORPIONICO, ANTIARACNIDICO, ANTIBOTROPICO, ANTICROTALICO, ANTIELAPIDICO, ANTILAQUETICO, ANTILOXOSCELICO, ANTILONOMICO]
    TipoUnidade:
      type: string
      enum: [HOSPITAL, UPA, UBS]
    LocalAvistamento:
      type: string
      enum: [CASA, QUINTAL, ESCOLA, TRABALHO_RURAL, VIA_PUBLICA, OUTRO]
    StatusResumo:
      type: string
      enum: [PENDENTE, PRONTO, MODELO_PADRAO]
    Perfil:
      type: string
      enum: [CIDADAO, GESTOR]
    Sintoma:
      type: string
      enum: [DOR_LOCAL, INCHACO_LOCAL, VERMELHIDAO, DORMENCIA, FALTA_DE_AR, VISAO_TURVA, VOMITOS, SUOR_INTENSO, SONOLENCIA_DESMAIO, SANGRAMENTO, INCHACO_ROSTO, MUITAS_PICADAS_ALERGIA]

    Erro:
      type: object
      properties:
        status: { type: integer, example: 400 }
        erro: { type: string, example: 'Dados inválidos' }
        mensagem: { type: string, example: 'Um ou mais campos são inválidos.' }
        campos:
          type: array
          description: Só em 400 de validação
          items:
            type: object
            properties:
              campo: { type: string, example: email }
              mensagem: { type: string, example: 'E-mail inválido' }
        caminho: { type: string, example: /api/auth/cadastro }
        timestamp: { type: string, format: date-time }

    Pagina:
      type: object
      properties:
        pagina: { type: integer, example: 0 }
        tamanho: { type: integer, example: 20 }
        totalElementos: { type: integer, format: int64, example: 3 }
        totalPaginas: { type: integer, example: 1 }

    CadastroRequest:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string, minLength: 2, maxLength: 120, example: 'Ana Souza' }
        email: { type: string, format: email, maxLength: 160, example: 'ana@teste.com' }
        senha: { type: string, minLength: 8, maxLength: 72, description: 'mín. 8, com letra e número', example: 'Teste@123' }
        telefone: { type: string, nullable: true, pattern: '^[0-9]{10,11}$', description: 'só dígitos (a máscara fica no app)', example: '11999990000' }

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email, example: 'cidadao@sospeconha.dev' }
        senha: { type: string, example: 'Teste@123' }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        tipo: { type: string, example: Bearer }
        expiraEmSegundos: { type: integer, example: 86400 }
        usuario: { $ref: '#/components/schemas/Usuario' }

    Usuario:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        nome: { type: string, example: 'Ana Souza' }
        email: { type: string, example: 'ana@teste.com' }
        telefone: { type: string, nullable: true, example: '11999990000' }
        perfil: { $ref: '#/components/schemas/Perfil' }
        criadoEm: { type: string, format: date-time }

    AtualizarUsuarioRequest:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 2, maxLength: 120 }
        telefone: { type: string, nullable: true, pattern: '^[0-9]{10,11}$' }

    UnidadeRequest:
      type: object
      required: [nome, tipo, endereco, telefone, latitude, longitude, atende24h, soros]
      properties:
        nome: { type: string, maxLength: 160, example: 'Hospital Exemplo Centro' }
        tipo: { $ref: '#/components/schemas/TipoUnidade' }
        endereco: { type: string, maxLength: 250, example: 'Rua Exemplo, 100 - Centro, São Paulo/SP' }
        telefone: { type: string, pattern: '^[0-9]{10,11}$', example: '1130000000' }
        latitude: { type: number, format: double, minimum: -34, maximum: 6, example: -23.5505 }
        longitude: { type: number, format: double, minimum: -74, maximum: -34, example: -46.6333 }
        atende24h: { type: boolean, example: true }
        soros:
          type: array
          description: Soros disponíveis (pode ser vazia)
          items: { $ref: '#/components/schemas/TipoSoro' }

    Unidade:
      allOf:
        - $ref: '#/components/schemas/UnidadeRequest'
        - type: object
          properties:
            id: { type: integer, format: int64, example: 1 }
            ativa: { type: boolean, example: true }
            atualizadoEm: { type: string, format: date-time }

    UnidadeProxima:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        nome: { type: string, example: 'Hospital Exemplo Centro' }
        tipo: { $ref: '#/components/schemas/TipoUnidade' }
        endereco: { type: string }
        telefone: { type: string, example: '1130000000' }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        atende24h: { type: boolean }
        distanciaKm: { type: number, format: double, example: 2.4, description: 'arredondado para 1 casa decimal' }
        sorosCompativeis:
          type: array
          items: { $ref: '#/components/schemas/TipoSoro' }

    PaginaUnidade:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            conteudo:
              type: array
              items: { $ref: '#/components/schemas/Unidade' }

    OcorrenciaRequest:
      type: object
      required: [tipoAnimal, faixaEtaria, sintomas, horaPicada, latitude, longitude]
      properties:
        tipoAnimal: { $ref: '#/components/schemas/TipoAnimal' }
        faixaEtaria: { $ref: '#/components/schemas/FaixaEtaria' }
        sintomas:
          type: array
          description: Pode ser vazia
          items: { $ref: '#/components/schemas/Sintoma' }
        horaPicada: { type: string, format: date-time, description: 'RN-G4: não pode estar no futuro (+5 min) nem passar de 72 h', example: '2026-11-10T22:15:00Z' }
        latitude: { type: number, format: double, minimum: -34, maximum: 6 }
        longitude: { type: number, format: double, minimum: -74, maximum: -34 }
        unidadeId: { type: integer, format: int64, nullable: true, description: 'unidade escolhida pelo usuário na tela de resultado' }

    Ocorrencia:
      type: object
      properties:
        id: { type: integer, format: int64, example: 10 }
        tipoAnimal: { $ref: '#/components/schemas/TipoAnimal' }
        faixaEtaria: { $ref: '#/components/schemas/FaixaEtaria' }
        sintomas:
          type: array
          items: { $ref: '#/components/schemas/Sintoma' }
        horaPicada: { type: string, format: date-time }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        urgencia: { $ref: '#/components/schemas/Urgencia' }
        motivos:
          type: array
          items: { type: string }
          example: ['Escorpião em criança']
        ligar192: { type: boolean }
        unidadeId: { type: integer, format: int64, nullable: true }
        unidadeNome: { type: string, nullable: true }
        statusResumo: { $ref: '#/components/schemas/StatusResumo' }
        resumo: { type: string, nullable: true, description: 'preenchido quando statusResumo ≠ PENDENTE' }
        avisoResumo: { type: string, example: 'Resumo gerado por IA. Não substitui avaliação profissional.' }
        aviso: { type: string, example: 'Procure atendimento médico imediatamente.' }
        criadoEm: { type: string, format: date-time }

    PaginaOcorrencia:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            conteudo:
              type: array
              items: { $ref: '#/components/schemas/Ocorrencia' }

    AvistamentoRequest:
      type: object
      required: [tipoAnimal, local, latitude, longitude, dataHora]
      properties:
        tipoAnimal: { $ref: '#/components/schemas/TipoAnimal' }
        local: { $ref: '#/components/schemas/LocalAvistamento' }
        latitude: { type: number, format: double, minimum: -34, maximum: 6 }
        longitude: { type: number, format: double, minimum: -74, maximum: -34 }
        dataHora: { type: string, format: date-time, description: 'não pode estar no futuro' }
        observacao: { type: string, maxLength: 500, nullable: true, example: 'Vi perto do ralo do banheiro' }

    Avistamento:
      allOf:
        - $ref: '#/components/schemas/AvistamentoRequest'
        - type: object
          properties:
            id: { type: integer, format: int64, example: 5 }
            criadoEm: { type: string, format: date-time }
            atualizadoEm: { type: string, format: date-time, nullable: true }

    PaginaAvistamento:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            conteudo:
              type: array
              items: { $ref: '#/components/schemas/Avistamento' }

    PrimeirosSocorros:
      type: object
      required: [tipoAnimal, faca, naoFaca, atencao]
      properties:
        tipoAnimal: { $ref: '#/components/schemas/TipoAnimal' }
        faca:
          type: array
          items: { type: string }
          example: ['Afaste-se do animal.', 'Lave o local com água e sabão.']
        naoFaca:
          type: array
          items: { type: string }
          example: ['Amarrar o local ou fazer torniquete.', 'Sugar o veneno.']
        atencao:
          type: array
          description: os cuidados daquele animal
          items: { type: string }
          example: ['Compressa morna pode aliviar a dor no caminho.']
