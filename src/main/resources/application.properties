spring.application.name=antidoto-api
server.port=${PORT:8080}

# Banco: sem DB_URL, H2 em memória no modo PostgreSQL (o mesmo SQL do Render).
# No Render: DB_URL=jdbc:postgresql://<host>:5432/<banco>, DB_USUARIO e DB_SENHA.
spring.datasource.url=${DB_URL:jdbc:h2:mem:antidoto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USUARIO:sa}
spring.datasource.password=${DB_SENHA:}

# O schema é do Flyway; o Hibernate só confere se as entidades batem com ele
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sem usuário em memória do Spring: o login é pelo banco + JWT (SecurityConfig)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# JWT (MVP-01 §5). Sem JWT_SECRET, a API cria um segredo aleatório a cada subida
# (bom no computador; no Render, defina JWT_SECRET para o login sobreviver a reinícios).
antidoto.jwt.segredo=${JWT_SECRET:}
antidoto.jwt.validade-em-segundos=86400

# CORS: só o app no navegador (Expo Web) precisa; o app no celular não usa CORS
antidoto.cors.origens=${CORS_ORIGENS:http://localhost:8081}

# Usuários de teste, unidades fictícias e os exemplos do cidadão. Só cria o que não existe.
antidoto.dados-iniciais=${CARREGAR_DADOS_INICIAIS:true}

# IA do resumo de pré-atendimento (MVP-01 §8): Groq, pela API compatível com a OpenAI.
# Desligada por padrão: sem IA_HABILITADA=true (e a GROQ_API_KEY), vale o modelo padrão.
antidoto.ia.habilitada=${IA_HABILITADA:false}
antidoto.ia.tempo-limite-em-segundos=6
spring.ai.openai.api-key=${GROQ_API_KEY:desligado}
spring.ai.openai.base-url=${IA_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.model=${IA_MODELO:openai/gpt-oss-120b}
spring.ai.openai.chat.temperature=0.2
spring.ai.openai.chat.reasoning-effort=low
spring.ai.openai.chat.max-completion-tokens=800
spring.ai.openai.chat.max-retries=0
# Só o chat: os outros modelos que o starter liga sozinho ficam desligados
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Swagger e saúde
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health

# Erros sempre no formato do contrato (TratadorGlobalDeErros), sem stack trace
server.error.include-stacktrace=never
